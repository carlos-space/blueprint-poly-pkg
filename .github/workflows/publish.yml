name: publish

# 發布入口：把一次發版的套件單元發布到各自的去處，alpha、beta、rc 與 GA 每個階段都發布。
#   npm、PyPI、crates.io   Trusted Publishing（OIDC），不讀任何 registry token
#   GitHub Packages        私有套件，用 GITHUB_TOKEN
#   Go、Swift              沒有 registry，mirror job 推到公開鏡像倉並打 tag
# npm 以階段名作 dist-tag，GA 才是 latest；PyPI 用 PEP 440 版號，crates.io 用 SemVer，兩者的預發布版預設都不會被安裝。
# 判斷集中在 scripts/release/publish-units.sh 與 scripts/release/mirror-units.sh。版號不屬於派送的階段時，
# plan job 在任何 registry 被寫入前就停下。
#
# 這是閉源倉庫以 Trusted Publishing 發公開套件的結構：build job 跑 self-hosted，打包 npm tgz、PyPI dist 並驗證
# crate，產物以 retention-days: 1 上傳；publish 是獨立發布 job，跑 ubuntu-latest，只下載產物並上傳，不再建置。這樣
# 建置不佔用託管 runner 時數，而 Trusted Publishing 只接受託管 runner 簽發的 OIDC token。產物只留 1 天，超過一天就
# 重新派送本檔。publish-github-packages 發到 GitHub Packages，不用 OIDC，單一 job 跑 ubuntu-latest。
#
# 由 release-please.yml 在發版後直接派送（gh workflow run publish.yml），也可以手動派送。不做成被 workflow_call
# 呼叫的 workflow：npm、PyPI、crates.io 的 Trusted Publisher 登記的都是本檔，被呼叫時 OIDC token 記的是呼叫端的
# workflow，比對不會通過。登記值是 owner、repo、workflow 檔名 publish.yml，environment 留空，本檔不宣告 environment。
# 本檔的 Trusted Publishing job 沒有任何 secrets 引用。
#
# 第一次發布：crates.io 的 Trusted Publishing 只能登記在已存在的 crate 上，第一版由使用者手動發布，在那之前
# publish job 略過 crates.io 並在摘要說明。npm 的套件也要先存在才能登記 Trusted Publisher。
#
# dry_run：每個發布步驟只印出要跑的指令，不寫任何 registry、也不推鏡像倉，用來演練派送。
on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'JSON array of released unit paths, e.g. ["packages/product-sdk-js", "facts"]; a path that is not a unit to publish is left out'
        required: true
        type: string
      stage:
        description: "release stage of the train; every unit's version must belong to it"
        required: true
        type: choice
        options: [alpha, beta, rc, ga]
      dry_run:
        description: "rehearse: print the commands each job would run and write nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

# GitHub keeps one pending run per group and a newer one replaces it. Every stage publishes, so a single group
# could drop a release queued behind another; the group is per stage, unit set and mode so only a repeat of the same
# request waits (publish-units.sh skips versions already on the registry).
concurrency:
  group: publish-${{ inputs.stage }}-${{ inputs.paths }}-${{ inputs.dry_run }}
  cancel-in-progress: false

env:
  # a loop of a template script asks twice at most and the CI gate asks twice (decision self-hosted-job-no-wait)
  POLL_TRIES: "2"
  CI_GATE_TRIES: "2"
  CI_GATE_QUEUE_TRIES: "0"

jobs:
  # 哪些路徑要發布、各用到哪種去處，以及所有不寫入的檢查：單元檔的版號等於 manifest、版號屬於階段、單元內容等於它的 tag。
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      paths: ${{ steps.reg.outputs.paths }}
      npm: ${{ steps.reg.outputs.npm }}
      github-packages: ${{ steps.reg.outputs.github-packages }}
      pypi: ${{ steps.reg.outputs.pypi }}
      crates: ${{ steps.reg.outputs.crates }}
      tp: ${{ steps.reg.outputs.tp }}
      mirror: ${{ steps.reg.outputs.mirror }}
      mirrors: ${{ steps.reg.outputs.mirrors }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: reg
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          mapfile -t all < <(jq -r '.[]' <<<"$PATHS")
          (( ${#all[@]} )) || { echo "no unit in this release"; exit 0; }
          # the verdict of every dispatched path, one line each: the target it is published to, or not-published
          bash scripts/release/publish-units.sh --report "${all[@]}"
          mapfile -t paths < <(bash scripts/release/publish-units.sh --filter "${all[@]}")
          echo "paths=$(jq -cn '$ARGS.positional' --args ${paths[@]+"${paths[@]}"})" >> "$GITHUB_OUTPUT"
          (( ${#paths[@]} )) || { echo "none of the released paths is a unit to publish"; exit 0; }
          regs="$(bash scripts/release/publish-units.sh --registries "${paths[@]}")"
          echo "$regs" | tee -a "$GITHUB_OUTPUT"
          echo "tp=$(grep -Eq '^(npm|pypi|crates)=true$' <<<"$regs" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "mirror=$(grep -Eq '^(go|swift)=true$' <<<"$regs" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "mirrors=$(bash scripts/release/publish-units.sh --mirrors "${paths[@]}")" >> "$GITHUB_OUTPUT"
      - name: Check every unit
        if: steps.reg.outputs.paths != '' && steps.reg.outputs.paths != '[]'
        env:
          PATHS: ${{ steps.reg.outputs.paths }}
          STAGE: ${{ inputs.stage }}
          PUBLISH_CHECK_ONLY: "1"
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          bash scripts/release/publish-units.sh "$STAGE" "${paths[@]}"

  # 建置 job：打包與驗證都在這裡，沒有 id-token，也不碰任何 registry 的憑證。
  build:
    needs: plan
    if: needs.plan.outputs.tp == 'true' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        if: needs.plan.outputs.npm == 'true'
      - if: needs.plan.outputs.npm == 'true'
        run: pnpm -r build
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: needs.plan.outputs.pypi == 'true'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: needs.plan.outputs.crates == 'true'
        with:
          toolchain: stable
      - name: 打包與驗證
        env:
          PATHS: ${{ needs.plan.outputs.paths }}
          STAGE: ${{ inputs.stage }}
          PUBLISH_OUT: ${{ runner.temp }}/publish
          PUBLISH_REGISTRIES: npm,pypi,crates
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          bash scripts/release/publish-units.sh pack "$STAGE" "${paths[@]}"
      # 私有倉庫的 artifact 計入組織的 Actions 儲存額度，只留 1 天。發布 job 在同一次 run 內馬上下載；
      # 超過一天就重新派送本檔，不續用舊產物。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-packages
          path: ${{ runner.temp }}/publish
          retention-days: 1
          if-no-files-found: error

  # 獨立發布 job：只下載 build job 的產物並上傳，不再建置。
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.tp == 'true' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      # crates.io 沒有上傳現成 .crate 的指令，要從源碼 cargo publish，所以檢出源碼
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-packages
          path: ${{ runner.temp }}/publish
      # crates.io 的 Trusted Publishing 只能登記在已存在的 crate 上。crate 還不存在時第一版由使用者手動發布，
      # 這一輪略過 crates.io，其他去處照常發布。
      - id: crate
        env:
          PATHS: ${{ needs.plan.outputs.paths }}
          NPM: ${{ needs.plan.outputs.npm }}
          PYPI: ${{ needs.plan.outputs.pypi }}
          CRATES: ${{ needs.plan.outputs.crates }}
        run: |
          regs=()
          [[ "$NPM" != true ]] || regs+=(npm)
          [[ "$PYPI" != true ]] || regs+=(pypi)
          exists=false
          if [[ "$CRATES" == true ]]; then
            mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
            if bash scripts/release/publish-units.sh --crate-exists "${paths[@]}"; then
              exists=true; regs+=(crates)
            else
              rc=$?
              [[ $rc == 1 ]] || { echo "::error::crates.io could not be asked whether the crate exists"; exit "$rc"; }
              echo "::notice::the crate is not on crates.io yet, so nothing was published there; its first version is published by hand"
              echo "- crates.io：crate 還不存在，Trusted Publishing 只能登記在已存在的 crate 上，第一版要手動發布，這一輪沒有發布。" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "registries=$(IFS=,; echo "${regs[*]:-}")" >> "$GITHUB_OUTPUT"
      # 只用 node 與 npm 上傳 tgz，不安裝相依套件。Trusted Publishing 要 npm 11.5.1 以上
      - uses: ./.github/actions/setup-workspace
        if: needs.plan.outputs.npm == 'true'
        with:
          registry-url: https://registry.npmjs.org
          install: "false"
      - if: needs.plan.outputs.npm == 'true'
        run: npm install -g npm@^11.5.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: needs.plan.outputs.pypi == 'true'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: steps.crate.outputs.exists == 'true'
        with:
          toolchain: stable
      # 短期憑證只在這個 job 內有效：crates.io 用 job 的 OIDC token 交換
      - id: auth
        if: steps.crate.outputs.exists == 'true' && !inputs.dry_run
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # npm 與 PyPI 的上傳都用 OIDC token，這一步不設任何 npm 或 PyPI 的 token。
      - name: 發布（Trusted Publishing）
        if: steps.crate.outputs.registries != ''
        env:
          PATHS: ${{ needs.plan.outputs.paths }}
          STAGE: ${{ inputs.stage }}
          PUBLISH_OUT: ${{ runner.temp }}/publish
          PUBLISH_REGISTRIES: ${{ steps.crate.outputs.registries }}
          PUBLISH_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          bash scripts/release/publish-units.sh upload "$STAGE" "${paths[@]}"

  # 私有套件發到 GitHub Packages，用 GITHUB_TOKEN 而不是 OIDC，所以單一 job 跑 ubuntu-latest，建置與上傳都在這裡。
  # Actions 的權限只能設在 job，所以真上傳要的 packages: write 單獨放在這個 job，上面的 job 沒有。token 只在
  # 上傳那一步以 NODE_AUTH_TOKEN 提供，不寫進任何檔案，也不設在 job 層。
  publish-github-packages:
    needs: plan
    if: needs.plan.outputs.github-packages == 'true' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          registry-url: https://npm.pkg.github.com
      - run: pnpm -r build
      - name: 發布到 GitHub Packages
        env:
          PATHS: ${{ needs.plan.outputs.paths }}
          STAGE: ${{ inputs.stage }}
          PUBLISH_OUT: ${{ runner.temp }}/publish
          PUBLISH_REGISTRIES: github-packages
          PUBLISH_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          bash scripts/release/publish-units.sh "$STAGE" "${paths[@]}"

  # 把每個 Go 與 Swift 單元的目錄當成鏡像倉的根目錄推到它的 main，打上沒有路徑前綴的版號 tag
  # （Go 是 v0.3.0-alpha.2，Swift 是 0.3.0-alpha.2）。鏡像倉只有這個 job 會寫，已發布的 tag 內容不同就拒絕。
  # 它跑在本檔而不是 tag 推送時，因為用 GITHUB_TOKEN 建的 tag 不觸發事件。推送用 GitHub App 的權杖，
  # 範圍只有這些鏡像倉的 contents: write。App 的名稱由 compose 依 fact 寫入。dry_run 不需要權杖。
  mirror:
    needs: plan
    if: needs.plan.outputs.mirror == 'true' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # 一次一個寫入者，兩次發版不會搶同一個 main。
    concurrency:
      group: mirror
      cancel-in-progress: false
    steps:
      # 要 tag：mirror-units.sh 讀每個單元 tag 的樹與 commit。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: app-token
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ needs.plan.outputs.mirrors }}
          permission-contents: write
      - name: 推到鏡像倉
        env:
          PATHS: ${{ needs.plan.outputs.paths }}
          MIRROR_PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          MIRROR_OWNER: ${{ github.repository_owner }}
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          flags=()
          if [[ "$DRY_RUN" == 1 ]]; then flags=(--dry-run)
          elif [[ -z "$MIRROR_PUSH_TOKEN" ]]; then
            echo "::error::no GitHub App token, so nothing can be pushed to the mirror repositories"; exit 1
          fi
          bash scripts/release/mirror-units.sh ${flags[@]+"${flags[@]}"} "${paths[@]}"
