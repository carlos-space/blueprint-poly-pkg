# Settings for scripts/ci/ci-scope.sh. The script is the same file in every repository that adopts the
# flow; what differs between repositories lives here. Patterns are git glob pathspecs: "*" stays within
# one directory level, "**" crosses levels.

# Paths that never change what ci builds or tests. A commit that touches only these skips ci.
CI_SCOPE_NON_SOURCE=(
  '*.md'
  '**/CHANGELOG.md'
  '**/.release-marker'
  'release-please-config.json'
  '.release-please-manifest.json'
)

# Paths that need the macOS job, and the paths under them that do not. CI_SCOPE_NATIVE_UNITS lists the SwiftPM
# package directories scripts/ci/native-build.sh builds. A repository without a Swift unit leaves all three empty, and
# the macOS job never has work. Composing a repository with a Swift unit writes its path here.
CI_SCOPE_NATIVE=()
CI_SCOPE_NATIVE_EXCLUDE=()
CI_SCOPE_NATIVE_UNITS=()

# 0: a pull request here checks only the affected units, so its green run does not stand in for the
# full-tree run of the push that merges it.
CI_SCOPE_PR_TREE=0
